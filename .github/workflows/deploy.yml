name: Build, test e deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VITE_APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}
  VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Testes unitarios (Vitest)
        run: npm run test:run

      - name: Instala navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes e2e (Playwright)
        run: npm run test:e2e

      - name: Build de producao
        run: npm run build

      - name: Guarda o build para o job de deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm ci --prefix functions

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Autentica no Google Cloud / Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-service-account.json

      - name: Deploy (hosting, firestore rules, storage rules, functions)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json
        run: npx firebase-tools deploy --only hosting,firestore:rules,storage,functions --project gestaofrotacge530101 --non-interactive
